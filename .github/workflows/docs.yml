name: docs
on:
  push:
    branches: [main]
    paths: ['docs/site/**', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm run build
      - run: cp dist/flickity.pkgd.min.js docs/site/assets/flickity.pkgd.min.js
      - run: cp dist/flickity.min.css docs/site/assets/flickity.css 2>/dev/null || cp css/flickity.css docs/site/assets/flickity.css
      - uses: actions/checkout@v4
        with:
          repository: oreoorbitz/Mepto
          path: ../Mepto
        continue-on-error: true
      - run: |
          mkdir -p docs/site/assets
          cp ../Mepto/dist/meptos.umd.cjs docs/site/assets/meptos.umd.cjs 2>/dev/null || (rm -rf ../Mepto 2>/dev/null; git clone --depth 1 https://github.com/oreoorbitz/Mepto.git ../Mepto 2>/dev/null && cp ../Mepto/dist/meptos.umd.cjs docs/site/assets/meptos.umd.cjs 2>/dev/null) || true
          if [ ! -s docs/site/assets/meptos.umd.cjs ] || [ $(wc -c < docs/site/assets/meptos.umd.cjs 2>/dev/null || echo 0) -lt 10000 ]; then
            echo "meptos UMD missing/small, fetching from Mepto repo raw"
            curl -fsSL https://raw.githubusercontent.com/oreoorbitz/Mepto/main/dist/meptos.umd.cjs -o docs/site/assets/meptos.umd.cjs || echo "raw github fallback failed"
          fi
          ls -lh docs/site/assets/meptos.umd.cjs 2>&1 || echo "no meptos UMD after fallback"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
